name: Build

on:
  push:
    tags: '*'
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
        description: 'Tag Name to be created'

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  VERSION: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build EX-word addon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build
        run: |
          cd ..
          curl -sSfL https://github.com/MaxSignal/buildscripts/releases/download/Linux/devkitPro.tar.gz | tar -zxf -
          cd -
          DEVKITPRO="$OLDPWD/devkitPro" DEVKITSH4="$DEVKITPRO/devkitSH4" PATH="$DEVKITPRO/tools/bin:$DEVKITSH4/bin:$PATH" make
          zip -r build.zip build

      - name: Publish
        run: gh release create "$VERSION" -t "$VERSION" -n "Automatic build of $(git rev-parse HEAD)." build.zip
